  <rect x="382" y="580" width="196" height="88" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <text x="480" y="614" font-size="16" font-weight="600" fill="#115E59" text-anchor="middle">fake_vision_</text>
  <text x="480" y="636" font-size="16" font-weight="600" fill="#115E59" text-anchor="middle">node</text>

  <rect x="614" y="580" width="196" height="88" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="712" y="614" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle">scan_executor_</text>
  <text x="712" y="636" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle">node</text>

  <rect x="846" y="580" width="196" height="88" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="944" y="614" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle">curobo_planner_</text>
  <text x="944" y="636" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle">node</text>

  <rect x="1078" y="580" width="196" height="88" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <text x="1176" y="608" font-size="16" font-weight="600" fill="#115E59" text-anchor="middle">sim_executor_</text>
  <text x="1176" y="628" font-size="16" font-weight="600" fill="#115E59" text-anchor="middle">bridge_node</text>
  <text x="1176" y="650" font-size="14" fill="#0F766E" text-anchor="middle">가상 두산 제어기</text>

  <rect x="1310" y="580" width="196" height="88" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="1408" y="614" font-size="17" font-weight="600" fill="#5B21B6" text-anchor="middle">Isaac Sim</text>
  <text x="1408" y="638" font-size="15" fill="#6D28D9" text-anchor="middle">articulation 구동</text>

  <g stroke="#475569" stroke-width="2" marker-end="url(#ar)">
    <line x1="346" y1="624" x2="378" y2="624"/>
    <line x1="578" y1="624" x2="610" y2="624"/>
    <line x1="810" y1="624" x2="842" y2="624"/>
    <line x1="1042" y1="624" x2="1074" y2="624"/>
    <line x1="1274" y1="624" x2="1306" y2="624"/>
