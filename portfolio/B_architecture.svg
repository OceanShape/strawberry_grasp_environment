  <text x="60" y="626" font-size="15" fill="#64748B">하드웨어 없음</text>

  <rect x="150" y="580" width="196" height="88" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="248" y="608" font-size="17" font-weight="600" fill="#5B21B6" text-anchor="middle">Isaac Sim USD 씬</text>
  <text x="248" y="630" font-size="14" fill="#6D28D9" text-anchor="middle">Script Editor 브릿지</text>
