<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="62" font-size="34" font-weight="700" fill="#0F172A">실기 파이프라인 vs 시뮬레이션 파이프라인</text>
  <text x="60" y="96" font-size="19" fill="#475569">같은 모션 플래너를 양쪽에서 구동한다. 갈리는 곳은 <tspan font-weight="700" fill="#0F172A">양 끝단(비전 입력 · 로봇 제어 출력)</tspan> 뿐이다.</text>

  <!-- 이식 구간 밴드 -->
  <rect x="552" y="140" width="500" height="600" rx="14" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="802" y="172" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">이식 구간 — 실기 모션 플래너 2노드</text>
  <text x="802" y="196" font-size="14" fill="#B45309" text-anchor="middle">실기·시뮬 양쪽에서 같은 소스로 동작 — 이식 수정 내역은 PLANNER_CHANGES.md</text>

  <!-- ===== 실기 레인 ===== -->
  <text x="60" y="252" font-size="22" font-weight="700" fill="#0F172A">실기</text>
  <text x="60" y="276" font-size="15" fill="#64748B">하드웨어 있음</text>

  <rect x="150" y="230" width="196" height="88" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="248" y="264" font-size="17" font-weight="600" fill="#334155" text-anchor="middle">Realsense D455</text>
  <text x="248" y="288" font-size="15" fill="#64748B" text-anchor="middle">+ YOLO seg/pose</text>

  <rect x="382" y="230" width="196" height="88" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="480" y="264" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle">strawberry_</text>
  <text x="480" y="286" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle">fusion_node</text>

  <rect x="614" y="230" width="196" height="88" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="712" y="264" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle">scan_executor_</text>
  <text x="712" y="286" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle">node</text>

  <rect x="846" y="230" width="196" height="88" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="944" y="264" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle">curobo_planner_</text>
  <text x="944" y="286" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle">node</text>

  <rect x="1078" y="230" width="196" height="88" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="1176" y="264" font-size="17" font-weight="600" fill="#334155" text-anchor="middle">두산 제어기</text>
  <text x="1176" y="288" font-size="15" fill="#64748B" text-anchor="middle">dsr_msgs2 서비스</text>

  <rect x="1310" y="230" width="196" height="88" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="1408" y="264" font-size="17" font-weight="600" fill="#334155" text-anchor="middle">실물 e0509</text>
  <text x="1408" y="288" font-size="15" fill="#64748B" text-anchor="middle">+ RH-P12-RN</text>

  <g stroke="#475569" stroke-width="2" marker-end="url(#ar)">
    <line x1="346" y1="274" x2="378" y2="274"/>
    <line x1="578" y1="274" x2="610" y2="274"/>
    <line x1="810" y1="274" x2="842" y2="274"/>
    <line x1="1042" y1="274" x2="1074" y2="274"/>
    <line x1="1274" y1="274" x2="1306" y2="274"/>
