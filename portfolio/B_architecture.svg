  <!-- 인터페이스 라벨 -->
  <text x="480" y="352" font-size="14" fill="#64748B" text-anchor="middle" font-family="'Noto Sans Mono CJK KR',monospace">/strawberry/detection/pick_pose</text>
  <text x="944" y="352" font-size="14" fill="#64748B" text-anchor="middle" font-family="'Noto Sans Mono CJK KR',monospace">MoveJoint · MoveLine · SafeGrasp</text>
  <text x="480" y="546" font-size="14" fill="#64748B" text-anchor="middle" font-family="'Noto Sans Mono CJK KR',monospace">/strawberry/detection/pick_pose</text>
  <text x="944" y="546" font-size="14" fill="#64748B" text-anchor="middle" font-family="'Noto Sans Mono CJK KR',monospace">MoveJoint · MoveLine · SafeGrasp</text>
  <text x="1408" y="546" font-size="14" fill="#64748B" text-anchor="middle" font-family="'Noto Sans Mono CJK KR',monospace">/joint_command</text>

  <!-- 대응 관계 점선 -->
  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)" marker-start="url(#arw)">
    <line x1="248" y1="322" x2="248" y2="576"/>
    <line x1="1176" y1="322" x2="1176" y2="576"/>
  </g>
  <text x="268" y="452" font-size="15" fill="#475569">입력단 대체</text>
  <text x="1196" y="452" font-size="15" fill="#475569">출력단 대체</text>

  <!-- 하단 요지 -->
  <rect x="60" y="742" width="1480" height="106" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="86" y="778" font-size="18" font-weight="700" fill="#0F172A">설계 요지 — 경계는 ROS 2 인터페이스 계약이다</text>
  <text x="86" y="806" font-size="16" fill="#334155">토픽·서비스·액션의 이름과 타입, QoS를 실기와 동일하게 맞추면 플래너는 상대가 실물인지 시뮬인지 알 수 없다.</text>
  <text x="86" y="832" font-size="16" fill="#334155">따라서 하드웨어 없이도 실기 제어 스택을 구동해 시퀀스·궤적·통신을 검증할 수 있다.</text>

  <!-- 범례 -->
  <g font-size="15">
    <rect x="1120" y="60" width="18" height="18" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="1146" y="75" fill="#334155">실기 팀 코드 (이식)</text>
    <rect x="1120" y="88" width="18" height="18" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
    <text x="1146" y="103" fill="#334155">본인 구현 (가상 제어기 계층)</text>
    <rect x="1370" y="60" width="18" height="18" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="1396" y="75" fill="#334155">Isaac Sim</text>
    <rect x="1370" y="88" width="18" height="18" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <text x="1396" y="103" fill="#334155">하드웨어</text>
