<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="58" font-size="34" font-weight="700" fill="#0F172A">USD 레이어 컴포지션 — 순정 애셋을 고치지 않는 구조</text>
  <text x="60" y="92" font-size="19" fill="#475569">임포트·순정 애셋은 읽기 전용으로 두고, 모든 커스터마이징은 <tspan font-weight="700" fill="#0F172A">상위 조립본과 오버라이드 레이어</tspan>에서만 한다.</text>

  <!-- 컬럼 헤더 -->
  <text x="60"   y="146" font-size="17" font-weight="700" fill="#0F766E">① 씬 · 오버라이드 레이어</text>
  <text x="560"  y="146" font-size="17" font-weight="700" fill="#B45309">② 조립본 (커스터마이징 지점)</text>
  <text x="1080" y="146" font-size="17" font-weight="700" fill="#475569">③ 원본 애셋 — 직접 수정 금지</text>

  <!-- ① main_scene -->
  <rect x="60" y="168" width="400" height="74" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.5"/>
  <text x="80" y="200" font-size="19" font-weight="700" fill="#115E59">main_scene.usd</text>
  <text x="80" y="226" font-size="15" fill="#0F766E">최상위 씬 — 조립만 한다 (지오메트리 직접 작성 금지)</text>

  <text x="80" y="272" font-size="15" font-weight="700" fill="#0F766E">subLayers  (USD는 strongest-first — 위가 더 강하다)</text>

  <rect x="60" y="286" width="400" height="60" rx="8" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2"/>
  <text x="80" y="310" font-size="16" font-weight="600" fill="#115E59">layout_layer.usd</text>
  <text x="80" y="332" font-size="14" fill="#0F766E">딸기 12개 위치 · 보드 정합(y=672.0mm) · 로봇 베이스</text>

  <rect x="60" y="354" width="400" height="60" rx="8" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2"/>
  <text x="80" y="378" font-size="16" font-weight="600" fill="#115E59">physics_layer.usd</text>
  <text x="80" y="400" font-size="14" fill="#0F766E">PhysicsScene · 정적 콜라이더 · 줄기 FixedJoint(20N/5Nm)</text>

  <rect x="60" y="422" width="400" height="60" rx="8" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2"/>
  <text x="80" y="446" font-size="16" font-weight="600" fill="#115E59">lighting_layer.usd</text>
  <text x="80" y="468" font-size="14" fill="#0F766E">DomeLight(studio.hdr) + RectLight 2</text>

  <!-- ② 조립본들 -->
  <rect x="560" y="168" width="420" height="74" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="580" y="198" font-size="18" font-weight="700" fill="#92400E">robot_assembly.usd</text>
  <text x="580" y="224" font-size="14" fill="#B45309">로봇 + D455 조립 · 오버라이드 2종 (아래 표)</text>

  <rect x="560" y="262" width="420" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="580" y="290" font-size="18" font-weight="700" fill="#92400E">strawberry.usd</text>
  <text x="580" y="314" font-size="14" fill="#B45309">variantSet "ripeness" · subLayer strawberry_physics.usd</text>

  <rect x="560" y="348" width="420" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="580" y="376" font-size="18" font-weight="700" fill="#92400E">lab_environment.usd</text>
  <text x="580" y="400" font-size="14" fill="#B45309">정적 환경 조립본 — main_scene에서 payload로 로드</text>

  <rect x="560" y="434" width="420" height="66" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="580" y="462" font-size="18" font-weight="700" fill="#92400E">cell_markers.usd</text>
  <text x="580" y="486" font-size="14" fill="#B45309">서브셀 꼭지점 마커 9개 — 시각 전용(콜라이더 없음)</text>

  <!-- ③ 원본 애셋 -->
  <rect x="1080" y="168" width="460" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="1100" y="192" font-size="16" font-weight="600" fill="#334155">doosan_e0509_rh_p12_rn/robot.usd</text>
  <text x="1100" y="214" font-size="14" fill="#64748B">URDF Importer 산출물 — 재빌드하면 통째로 교체된다</text>

  <rect x="1080" y="238" width="460" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="1100" y="262" font-size="16" font-weight="600" fill="#5B21B6">rsd455.usd</text>
  <text x="1100" y="284" font-size="14" fill="#6D28D9">NVIDIA 순정 D455 — Nucleus가 아닌 로컬 사본을 참조</text>

  <rect x="1080" y="308" width="460" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="1100" y="332" font-size="16" font-weight="600" fill="#334155">strawberry_ripe.usd / _unripe.usd</text>
  <text x="1100" y="354" font-size="14" fill="#64748B">지오메트리 + 머티리얼 (variant가 골라 붙인다)</text>

  <rect x="1080" y="378" width="460" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="1100" y="402" font-size="16" font-weight="600" fill="#334155">table.usd / whiteboard.usd</text>
  <text x="1100" y="424" font-size="14" fill="#64748B">소품 애셋 (보드에 딸기 attach_points 정의)</text>

  <!-- 화살표 -->
  <g stroke="#64748B" stroke-width="2" marker-end="url(#a1)" fill="none">
    <path d="M460,196 L510,196 L510,196 L556,196"/>
    <path d="M460,205 C505,205 505,295 556,295"/>
    <path d="M460,214 C500,214 500,381 556,381"/>
    <path d="M460,223 C495,223 495,467 556,467"/>
    <line x1="980" y1="196" x2="1076" y2="196"/>
    <path d="M980,214 C1030,214 1030,268 1076,268"/>
    <path d="M980,295 L1030,295 L1030,338 L1076,338"/>
    <path d="M980,381 L1030,381 L1030,408 L1076,408"/>
  </g>
  <text x="488" y="172" font-size="13" fill="#64748B">references</text>
  <text x="1000" y="158" font-size="13" fill="#64748B">references / payload</text>

  <!-- 오버라이드 표 -->
  <rect x="60" y="524" width="1480" height="248" rx="12" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
  <text x="86" y="558" font-size="20" font-weight="700" fill="#92400E">순정 애셋을 열지 않고 해결한 것들 — 전부 오버라이드로 처리</text>

  <text x="86"  y="596" font-size="15" font-weight="700" fill="#B45309">어디에</text>
  <text x="450" y="596" font-size="15" font-weight="700" fill="#B45309">무엇을</text>
  <text x="900" y="596" font-size="15" font-weight="700" fill="#B45309">왜</text>
  <line x1="86" y1="606" x2="1514" y2="606" stroke="#FCD34D" stroke-width="1.5"/>

  <text x="86"  y="634" font-size="15" fill="#334155" font-family="'Noto Sans Mono CJK KR',monospace">robot_assembly.usd</text>
  <text x="450" y="634" font-size="15" fill="#334155" font-family="'Noto Sans Mono CJK KR',monospace">physics:rigidBodyEnabled = False</text>
  <text x="900" y="634" font-size="15" fill="#334155">순정 D455가 독립 강체라 "강체 안의 강체" → articulation 초기화 실패</text>

  <text x="86"  y="666" font-size="15" fill="#334155" font-family="'Noto Sans Mono CJK KR',monospace">robot_assembly.usd</text>
  <text x="450" y="666" font-size="15" fill="#334155" font-family="'Noto Sans Mono CJK KR',monospace">drive stiffness/damping 1e5·1e4</text>
  <text x="900" y="666" font-size="15" fill="#334155">임포터 기본 게인이 damping≈0(감쇠 없는 스프링) → 팔 출렁임·떨림</text>

  <text x="86"  y="698" font-size="15" fill="#334155" font-family="'Noto Sans Mono CJK KR',monospace">layout_layer.usd</text>
  <text x="450" y="698" font-size="15" fill="#334155" font-family="'Noto Sans Mono CJK KR',monospace">보드 −109.5mm / 딸기 −158.9mm</text>
  <text x="900" y="698" font-size="15" fill="#334155">씬 기하를 실기 벽 실측값(672.0mm)에 정합 — 접근 오차 131.7mm → 0.0mm</text>

  <text x="86"  y="730" font-size="15" fill="#334155" font-family="'Noto Sans Mono CJK KR',monospace">physics_layer.usd</text>
  <text x="450" y="730" font-size="15" fill="#334155" font-family="'Noto Sans Mono CJK KR',monospace">breakForce 2N → 20N</text>
  <text x="900" y="730" font-size="15" fill="#334155">2N은 과실 자중의 10.2배뿐이라 스치기만 해도 줄기가 끊겨 날아감</text>

  <text x="86"  y="762" font-size="15" fill="#64748B">→ URDF를 재빌드해 임포트 산출물이 교체돼도 위 오버라이드는 상위 레이어에 남아 유지된다.</text>

  <!-- 하단 요지 -->
  <rect x="60" y="792" width="1480" height="62" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="86" y="818" font-size="17" font-weight="700" fill="#0F172A">얻는 것</text>
  <text x="170" y="818" font-size="16" fill="#334155">애셋 갱신·협업 시 충돌이 나지 않고, "무엇을 왜 바꿨는지"가 레이어 diff 하나로 드러난다.</text>
  <text x="86" y="842" font-size="16" fill="#334155">물리를 별도 레이어로 분리해 두었으므로 Layer 창에서 mute 하면 물리 없이 비주얼만 확인할 수 있다.</text>
</svg>
